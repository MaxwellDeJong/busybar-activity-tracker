# Mosquitto config for the Busy Bar recorder on a trusted home LAN.
#
# The bar publishes snapshots here (over WiFi, via the router→homelab bridge) and
# the recorder subscribes as a DURABLE session, so QoS-1 messages are queued for
# it while it restarts. `persistence` keeps that queue across broker restarts too.
#
# This is plain + anonymous, appropriate for a segmented LAN. To harden, see the
# commented block at the bottom and docs/mqtt-migration.md §3.1 / §4.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Keep queued QoS-1 messages for an offline durable subscriber effectively
# unbounded (0 = no limit) so a long recorder outage still backfills on return.
max_queued_messages 0
persistent_client_expiration 7d

# --- Optional hardening (uncomment + provide files) -------------------------
# allow_anonymous false
# password_file /mosquitto/config/passwd        # mosquitto_passwd -c passwd busybar
#
# TLS fallback if the device refuses plain mqtt:// (docs/mqtt-migration.md §3.1):
# listener 8883 0.0.0.0
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
